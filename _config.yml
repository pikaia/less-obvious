title: Less Obvious
description: Ideas that are not unknown — just less clear, and less thought out.
baseurl: "/less-obvious"
url: "https://pikaia.github.io"
theme: minima
minima:
  skin: dark
  social_links:
    github: pikaia

# Show latest posts on the homepage
show_excerpts: true

# Markdown settings
markdown: kramdown

# Permalink structure: /2026/11/09/post-title/
permalink: /:year/:month/:day/:title/

# Plugins (all supported natively by GitHub Pages, no build step needed)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

lang: en

# Files that exist for repo/tooling purposes only, not part of the site
exclude:
  - README.md
  - scripts
  - scratch
